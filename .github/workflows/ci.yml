name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Pixel renderer and generated assets
        run: |
          node --test tools/pixelart/render.test.mjs
          node tools/pixelart/cli.mjs --check
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tui/go.sum
      - name: Format and module boundaries
        run: |
          test -z "$(find . -maxdepth 1 -type f -name '*.go' -print)"
          test -z "$(gofmt -l .)"
          GOWORK=off go list -deps ./... > /tmp/root-deps
          ! grep -Eq '^(charm.land/|github.com/lrstanley/bubblezone)' /tmp/root-deps
      - name: Root vet, race tests and coverage
        run: |
          GOWORK=off go vet ./...
          GOWORK=off go test -race -count=1 -coverpkg=./... -coverprofile=coverage-root.out ./...
          coverage=$(GOWORK=off go tool cover -func=coverage-root.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Root aggregate coverage: ${coverage}%"
          awk -v value="$coverage" 'BEGIN { exit !(value > 80) }'
      - name: TUI vet, race tests and coverage
        run: |
          go -C tui vet ./...
          go -C tui test -race -count=1 -coverpkg=./... -coverprofile=coverage-tui.out ./...
          coverage=$(go -C tui tool cover -func=coverage-tui.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "TUI aggregate coverage: ${coverage}%"
          awk -v value="$coverage" 'BEGIN { exit !(value > 80) }'
      - name: Static executable builds
        run: |
          GOWORK=off CGO_ENABLED=0 go build -trimpath -o /tmp/axlr ./cmd/axlr
          GOWORK=off CGO_ENABLED=0 go -C tui build -trimpath -o /tmp/axlr-tui ./cmd/axlr-tui
