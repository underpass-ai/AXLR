openapi: 3.1.0
info:
  title: AXLR service API
  version: 0.1.0
  description: Versioned agent sessions and exact tool calls over mandatory client-certificate TLS.
servers:
  - url: https://localhost:8443
security:
  - clientCertificate: []
paths:
  /v1/sessions:
    post:
      operationId: createSession
      description: Requires session_client or admin. Workspace is fixed by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model]
              properties:
                model: {type: string, minLength: 1}
                policy:
                  description: The execution's policy (the runtime contract); the session keeps it and every turn and decision applies it.
                  $ref: '#/components/schemas/ExecutionPolicy'
                budget:
                  description: The execution's budget (the runtime contract), enforced outside the model; the session keeps it and its seconds count from the session's creation.
                  $ref: '#/components/schemas/ExecutionBudget'
                correlation:
                  description: The execution's correlation ids (the runtime contract), carried unchanged into every event, the result and the session's records.
                  $ref: '#/components/schemas/ExecutionCorrelation'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedSession'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    get:
      operationId: getSession
      description: Owner or admin only.
      responses:
        '200':
          description: Session snapshot, revision and event cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sessions/{id}/turns:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: startTurn
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt, expected_revision]
              properties:
                prompt: {type: string, minLength: 1}
                expected_revision: {type: integer, minimum: 1}
      responses:
        '202':
          description: Turn accepted; follow the event URL.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sessions/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    get:
      operationId: streamEvents
      description: >-
        Ordered replay after the exclusive cursor, followed by live events. Each SSE frame
        has id as decimal sequence, event as type, and data as a JSON Event. Heartbeats
        are SSE comments. The after query takes precedence over Last-Event-ID.
        An invalid cursor or a cursor ahead of the journal returns 400 invalid_cursor.
        Disconnecting does not cancel the turn.
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: Last-Event-ID, in: header, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/Event'}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sessions/{id}/approvals/{call_id}:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
      - {name: call_id, in: path, required: true, schema: {type: string, minLength: 1}}
    post:
      operationId: decideSessionTool
      description: Requires approver or admin; authorizes exactly the first pending call.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        $ref: '#/components/requestBodies/Decision'
      responses:
        '202':
          description: Decision accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sessions/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: cancelSessionTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '202':
          description: Cancellation requested; external effects cannot be rolled back.
        default: {$ref: '#/components/responses/Error'}
  /v1/sessions/{id}/close:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: closeSession
      description: Ends the session's MADE instance and journals session.closed; the transcript stays and a later turn continues in the instance's successor. Refuses a running turn with 409 operation_in_progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Session closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  status: {type: string, enum: [closed]}
                  revision: {type: integer}
        default: {$ref: '#/components/responses/Error'}
  /v1/tools:
    get:
      operationId: listTools
      description: Requires tool_operator or admin. Lists exact local and MCP tool identities.
      parameters:
        - {name: origin, in: query, schema: {type: string, enum: [local, mcp]}}
      responses:
        '200':
          description: Available tools and JSON schemas.
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools: {type: array, items: {$ref: '#/components/schemas/Tool'}}
        default: {$ref: '#/components/responses/Error'}
  /v1/tool-calls:
    post:
      operationId: createToolCall
      description: Requires tool_operator or admin. Manual review is the default.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool, arguments]
              properties:
                tool: {type: string}
                arguments: {type: object}
      responses:
        '202':
          description: Call intent persisted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallReference'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tool-calls/{id}:
    parameters:
      - {$ref: '#/components/parameters/CallID'}
    get:
      operationId: getToolCall
      responses:
        '200':
          description: Durable call state and result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolCall'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tool-calls/{id}/decisions:
    parameters:
      - {$ref: '#/components/parameters/CallID'}
    post:
      operationId: decideToolCall
      description: Requires approver or admin. Approves or denies this exact call.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        $ref: '#/components/requestBodies/Decision'
      responses:
        '202':
          description: Decision persisted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallReference'}
        default: {$ref: '#/components/responses/Error'}
  /v1/operations/{verb}:
    parameters:
      - {name: verb, in: path, required: true, schema: {type: string, enum: [Read, Write, Edit, Exec, ListPlugins, CallPlugin, CreateSession, GetSession, StartTurn, StreamEvents, DecideSessionTool, CancelSessionTurn, ListTools, CreateToolCall, GetToolCall, DecideToolCall, Liveness, Readiness]}}
    post:
      operationId: invokeOperation
      description: >-
        Transport-neutral form of the capability named by verb, shared with the gRPC RPC and the
        MCP tool of the same name; docs/transport-parity.md lists each verb's arguments. The body
        is the verb's argument object and an absent or empty body is {}. request_id and
        idempotency_key travel in the body instead of headers, and the X-Request-Id response
        header follows the envelope. The HTTP status repeats the envelope's status_code, except
        that probe results use HTTP 200 with status_code 204. Failures keep the Error schema in
        body, including not_ready for probe failures and invalid_id for an empty resource ID.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id: {type: string, maxLength: 128}
                idempotency_key: {type: string, pattern: '^[A-Za-z0-9._~-]{16,128}$'}
      responses:
        '2XX':
          description: Result envelope; body is the response of the underlying REST route or null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResult'}
        default:
          description: Result envelope whose body is an Error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationResult'}
  /mcp:
    post:
      operationId: mcp
      description: >-
        Stateless MCP Streamable HTTP endpoint on the API listener. Each POST carries one
        JSON-RPC 2.0 message and is authenticated by its own client certificate; no MCP session
        ID is issued. tools/list returns the 18 axlr_* tools and tools/call returns the
        OperationResult envelope as structuredContent and as text, with isError set for
        status_code 400 and above. GET and DELETE return 405.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: JSON-RPC 2.0 request or notification.}
      responses:
        '200':
          description: JSON-RPC response as JSON or as a single-message SSE stream; Accept must list both media types.
          content:
            application/json:
              schema: {type: object}
            text/event-stream:
              schema: {type: string}
        '405': {description: Only POST is served on the stateless endpoint.}
        default: {$ref: '#/components/responses/Error'}
  /livez:
    get:
      operationId: liveness
      security: []
      description: Served only on the separate loopback probe listener.
      responses:
        '204': {description: Process is live.}
  /readyz:
    get:
      operationId: readiness
      security: []
      description: Served only on the separate loopback probe listener; checks nonempty model credential configuration and tool discovery through both engines, without a model completion or engine write.
      responses:
        '204': {description: Service is ready.}
        '503': {description: Required dependency unavailable.}
components:
  securitySchemes:
    clientCertificate: {type: mutualTLS}
  parameters:
    SessionID: {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
    CallID: {name: id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9._~-]{16,128}$'}}
  requestBodies:
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [decision, expected_revision]
            properties:
              decision: {type: string, enum: [approve, deny]}
              expected_revision: {type: integer, minimum: 1}
  responses:
    Error:
      description: Error; codes include invalid_json, invalid_id, forbidden, not_found, stale_revision, idempotency_conflict, engine_unavailable, storage_error, internal_error, unknown_operation and not_ready.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    CreatedSession:
      type: object
      required: [id, model, status, revision]
      properties:
        id: {type: string}
        model: {type: string}
        status: {type: string, const: idle}
        revision: {type: integer, minimum: 1}
    Session:
      type: object
      required: [id, model, status, revision, last_sequence, messages]
      properties:
        id: {type: string}
        model: {type: string}
        status: {type: string, enum: [idle, streaming, approval, interrupted, complete]}
        revision: {type: integer}
        operation_id: {type: string}
        last_sequence: {type: integer}
        messages: {type: array, items: {type: object}}
        pending: {type: array, items: {type: object}}
        result:
          description: The execution's result as the session stands (the runtime contract); null until a turn ends.
          oneOf: [{$ref: '#/components/schemas/ExecutionResult'}, {type: 'null'}]
        receipt:
          description: The execution's receipt as the session stands (the runtime contract), over this session's requests and calls; null until a turn ends.
          oneOf: [{$ref: '#/components/schemas/ExecutionReceipt'}, {type: 'null'}]
        policy:
          description: The execution's policy the session runs under; null without one.
          oneOf: [{$ref: '#/components/schemas/ExecutionPolicy'}, {type: 'null'}]
        budget:
          description: The execution's budget the session runs under, its limits as given; null without one.
          oneOf: [{$ref: '#/components/schemas/ExecutionBudget'}, {type: 'null'}]
        correlation:
          description: The execution's correlation ids; null without any.
          oneOf: [{$ref: '#/components/schemas/ExecutionCorrelation'}, {type: 'null'}]
    Operation:
      type: object
      required: [operation_id, session_id, status]
      properties:
        operation_id: {type: string}
        session_id: {type: string}
        status: {type: string}
        events_url: {type: string}
    Event:
      type: object
      required: [session_id, operation_id, sequence, time, type, payload]
      properties:
        session_id: {type: string}
        operation_id: {type: string}
        sequence: {type: integer, minimum: 1}
        time: {type: string, format: date-time}
        type: {type: string, enum: [turn.started, text.delta, tool.requested, approval.required, tool.completed, artifact, turn.completed, turn.interrupted, operation.failed, approval.decision]}
        payload:
          type: object
          description: The event that ends a turn (approval.required, turn.completed, turn.interrupted, operation.failed) carries the execution's result in `result`. An artifact event, after the tool.completed of the axlr_deliver call that delivered it, carries `call_id` and `artifact` (ExecutionArtifact). Every event of a session with a correlation carries it in `correlation`.
    ExecutionResult:
      type: object
      description: The runtime contract's result object (docs/runtime-contract.md); the same object `axlr-tui --exec --json` writes last.
      required: [schema, status, session_id, sessions, answer, tool_calls, usage, artifacts]
      properties:
        schema: {type: string, const: axlr.execution-result/v1}
        status: {type: string, enum: [completed, needs_decision, interrupted, failed, budget_exceeded], description: budget_exceeded is a limit of the execution's budget reached before the next request or call; error names it.}
        session_id: {type: string}
        sessions: {type: array, items: {type: string}, description: Every session the execution spanned, first to last.}
        answer: {type: string}
        pending: {$ref: '#/components/schemas/ExecutionCall'}
        error: {type: string}
        tool_calls: {type: array, items: {$ref: '#/components/schemas/ExecutionCall'}}
        usage: {$ref: '#/components/schemas/ExecutionUsage'}
        artifacts: {type: array, items: {$ref: '#/components/schemas/ExecutionArtifact'}, description: What the execution delivered with axlr_deliver, in every session it spanned, in delivery order; a later delivery of the same reference replaces the earlier one.}
        correlation: {$ref: '#/components/schemas/ExecutionCorrelation'}
    ExecutionReceipt:
      type: object
      description: The runtime contract's receipt (docs/runtime-contract.md, Receipt), read from the session and its receipt journal, which survives a restart; the same object `axlr-tui --exec --json` writes just before the result.
      required: [schema, status, session_id, sessions, started_at, ended_at, requests, tool_calls, total, complete]
      properties:
        schema: {type: string, const: axlr.execution-receipt/v1}
        status: {type: string, enum: [completed, needs_decision, interrupted, failed, budget_exceeded]}
        session_id: {type: string}
        sessions: {type: array, items: {type: string}}
        started_at: {type: string, format: date-time, description: The budget's start, else the first message or record.}
        ended_at: {type: string, format: date-time, description: The last message or record.}
        policy:
          type: object
          required: [level, sha256]
          properties:
            level: {type: string, enum: [observe, propose, act-with-approval, act-within-policy]}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the policy's compact JSON as the contract writes it.}
        budget:
          type: object
          required: [sha256, limits]
          properties:
            sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the limits' compact JSON.}
            limits: {$ref: '#/components/schemas/ExecutionBudget'}
        correlation: {$ref: '#/components/schemas/ExecutionCorrelation'}
        requests: {type: array, items: {$ref: '#/components/schemas/ReceiptRequest'}}
        tool_calls: {type: array, items: {$ref: '#/components/schemas/ReceiptCall'}}
        total: {$ref: '#/components/schemas/ExecutionUsage'}
        complete: {type: boolean, description: Every request the ledgers counted and every call that ran is itemized.}
    ReceiptRequest:
      type: object
      required: [session_id, index, started_at, status, model, prompt_tokens, cached_tokens, cache_write_tokens, completion_tokens, reasoning_tokens, cost_usd, unmetered]
      properties:
        session_id: {type: string}
        index: {type: integer, minimum: 1, description: The request's place in its session, from 1.}
        started_at: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0, description: Absent for an interrupted request.}
        status: {type: string, enum: [completed, failed, cancelled, interrupted], description: interrupted is a request the process died during; its tokens and cost are unknown.}
        model: {type: string, description: The model the request asked for.}
        provider: {type: string, description: Who served it, when the endpoint says.}
        prompt_tokens: {type: integer}
        cached_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        completion_tokens: {type: integer}
        reasoning_tokens: {type: integer}
        cost_usd: {type: [number, 'null'], description: Null when the request reported no cost.}
        unmetered: {type: boolean, description: Its tokens are estimates.}
    ReceiptCall:
      type: object
      required: [session_id, call_id, tool, arguments_sha256, status]
      properties:
        session_id: {type: string}
        call_id: {type: string}
        tool: {type: string}
        arguments_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the call's arguments as the session keeps them, compact JSON.}
        outcome_sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the result's text; absent while pending.}
        decision: {type: string, enum: [approve, auto_approve, deny]}
        status: {type: string, enum: [pending, forbidden, denied, completed, failed, uncertain]}
        started_at: {type: string, format: date-time, description: Absent for a call that did not run.}
        duration_ms: {type: integer, minimum: 0, description: Absent for a call that did not run or never ended.}
    ExecutionArtifact:
      type: object
      description: One deliverable of an execution (docs/runtime-contract.md, Artifacts). The file is the workspace's; a file changed after its delivery no longer matches sha256.
      required: [name, media_type, size, sha256, reference, description, source, session_id, call_id]
      properties:
        name: {type: string, maxLength: 128, description: "The deliverable's file name: letters, digits, '.', '_' and '-'."}
        media_type: {type: string, description: A lower-case type/subtype without parameters.}
        size: {type: integer, minimum: 0, description: Bytes delivered.}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Hex digest of the bytes delivered, taken when the call ran.}
        reference: {type: string, description: "The file's path relative to the workspace, with / separators; inline content is at .axlr/deliverables/<session_id>/<name>."}
        description: {type: string, maxLength: 300}
        source: {type: string, enum: [file, inline], description: file is a workspace file delivered as it is; inline is content the call carried.}
        session_id: {type: string}
        call_id: {type: string}
    ExecutionCall:
      type: object
      required: [call_id, tool]
      properties:
        call_id: {type: string}
        tool: {type: string}
        decision: {type: string, enum: [approve, auto_approve, deny]}
        status: {type: string, enum: [pending, forbidden, denied, completed, failed, uncertain], description: forbidden is a call the execution's policy refused outside the model.}
        arguments: {type: object, description: Only on the pending call.}
    ExecutionPolicy:
      type: object
      description: The runtime contract's policy per execution (docs/runtime-contract.md). With an allow list, every tool it does not name is forbidden; a deny rule wins over an allow rule; the policy only narrows what the approval level and the settings allow.
      additionalProperties: false
      required: [level, tools]
      properties:
        level: {type: string, enum: [observe, propose, act-with-approval, act-within-policy]}
        tools:
          type: object
          additionalProperties: false
          properties:
            allow: {type: array, items: {$ref: '#/components/schemas/ExecutionPolicyRule'}}
            deny: {type: array, items: {$ref: '#/components/schemas/ExecutionPolicyRule'}}
    ExecutionPolicyRule:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128, description: "The tool's name as the model calls it, or an MCP tool's own name or <plugin>/<tool>; * ** and ? are globs."}
        arguments: {type: object, additionalProperties: {type: string, minLength: 1, maxLength: 256}, description: Patterns the call's arguments must match, over each value as text.}
    ExecutionBudget:
      type: object
      description: The runtime contract's budget per execution (docs/runtime-contract.md), enforced outside the model; each limit zero or absent for no limit.
      additionalProperties: false
      properties:
        seconds: {type: integer, minimum: 0, maximum: 2592000, description: Seconds since the execution began; a deadline on the turn.}
        requests: {type: integer, minimum: 0, maximum: 1000000, description: Model requests the execution may make.}
        tool_calls: {type: integer, minimum: 0, maximum: 1000000, description: Tool calls the execution may run.}
        usd: {type: number, minimum: 0, maximum: 1000000, description: Dollars the execution's requests may report.}
    ExecutionCorrelation:
      type: object
      description: The runtime contract's correlation per execution (docs/runtime-contract.md), carried unchanged; each id is letters, digits and -_.:/@+=, at most 128 characters.
      additionalProperties: false
      properties:
        bot_id: {type: string, maxLength: 128}
        task_id: {type: string, maxLength: 128}
        execution_id: {type: string, maxLength: 128}
        trace_id: {type: string, maxLength: 128}
    ExecutionUsage:
      type: object
      required: [requests, prompt_tokens, cached_tokens, cache_write_tokens, completion_tokens, reasoning_tokens, cost_usd, cost_requests, unmetered_requests]
      properties:
        requests: {type: integer}
        prompt_tokens: {type: integer}
        cached_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        completion_tokens: {type: integer}
        reasoning_tokens: {type: integer}
        cost_usd: {type: number}
        cost_requests: {type: integer, description: Requests that reported a cost; cost_usd sums them.}
        unmetered_requests: {type: integer, description: Requests that reported no usage; billed by the provider but not counted.}
    Tool:
      type: object
      required: [name, origin, identity, schema, available]
      properties:
        name: {type: string}
        origin: {type: string, enum: [local, mcp]}
        identity: {type: object}
        description: {type: string}
        schema: {type: object}
        available: {type: boolean}
    OperationResult:
      type: object
      required: [status_code, request_id, body]
      properties:
        status_code: {type: integer}
        request_id: {type: string}
        body: {description: The underlying REST response, null for probes, or an Error.}
    CallReference:
      type: object
      required: [call_id, status, revision]
      properties:
        call_id: {type: string}
        status: {type: string}
        revision: {type: integer}
    ToolCall:
      type: object
      required: [call_id, owner, tool, identity, arguments, status, revision]
      properties:
        call_id: {type: string}
        owner: {type: string}
        tool: {type: string}
        identity: {type: object}
        arguments: {type: object}
        status: {type: string, enum: [pending_approval, running, completed, failed, rejected, cancelled, timed_out, uncertain]}
        revision: {type: integer}
        decision: {type: string}
        result: {type: object}
