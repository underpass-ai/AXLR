version: '1.0'
name: axlr_improve
description: Improve AXLR itself in a disposable clone. The agent settles criteria and a check command that fails while the improvement is missing, then makes the change until the check passes; the console opens the pull request, watches its checks, merges it only when the person approves, and records the outcome in project memory; at most three attempts per phase and two check rounds, then BLOCKED.
inputs:
  required:
  - improvement_brief
  - workspace
  - repository
  optional:
  - memory_about
  - issue
outputs:
  improvement_report:
    type: object
states:
- id: BRIEF
  initial: true
- id: BUILD
- id: PROPOSE
- id: WATCH
- id: DECIDE
- id: MERGE
- id: COMPLETED
  terminal: true
- id: BLOCKED
  terminal: true
transitions:
- from: BRIEF
  to: BUILD
  trigger: briefed
  guards: [brief_completed, improvement_missing]
- from: BRIEF
  to: BLOCKED
  trigger: not_feasible
  guards: [brief_completed, declared_not_feasible]
- from: BRIEF
  to: BLOCKED
  trigger: brief_exhausted
  guards: [brief_exhausted]
- from: BUILD
  to: PROPOSE
  trigger: verified
  guards: [build_completed, check_passes]
- from: BUILD
  to: BLOCKED
  trigger: build_exhausted
  guards: [build_exhausted]
- from: PROPOSE
  to: WATCH
  trigger: proposed
  guards: [propose_completed, pull_request_open]
- from: PROPOSE
  to: BLOCKED
  trigger: propose_failed
  guards: [propose_completed, pull_request_failed]
- from: WATCH
  to: DECIDE
  trigger: checks_passed
  guards: [watch_completed, checks_green]
- from: WATCH
  to: BUILD
  trigger: checks_failed
  guards: [watch_completed, checks_red]
- from: WATCH
  to: BLOCKED
  trigger: watch_blocked
  guards: [watch_completed, checks_blocked]
- from: DECIDE
  to: MERGE
  trigger: merge_approved
  guards: [decide_completed, person_requested_merge, person_approves]
- from: DECIDE
  to: BLOCKED
  trigger: merge_declined
  guards: [decide_completed, person_declined]
- from: MERGE
  to: COMPLETED
  trigger: merged
  guards: [merge_completed, pull_request_merged]
- from: MERGE
  to: BLOCKED
  trigger: merge_failed
  guards: [merge_completed, pull_request_not_merged]
steps:
- id: brief
  state: BRIEF
  handler: host_callback
  repeat:
    max_iterations: 3
    until:
      output_field: settled
      equals: true
  config:
    num_agents: 1
    prompt: Read the clone and settle the improvement. Return criteria (observable behaviour), scope and check_command, the command whose zero exit proves the criteria. The console runs it once before any change and records missing=true only when it exits non-zero; return feasible=false with the reason when the improvement already exists or cannot be made safely as a small change. The console sets settled=true once the improvement is shown missing or declared not feasible.
    see_prior: true
- id: build
  state: BUILD
  handler: host_callback
  repeat:
    max_iterations: 3
    until:
      output_field: verified
      equals: true
  config:
    num_agents: 1
    prompt: Implement the smallest change that meets the criteria and add a test when it protects meaningful behaviour; after a red check round fix what the CI output shows without growing scope. Return summary and summary_en. The console reruns the approved check command and records verified=true only when it exits zero.
    see_prior: true
- id: propose
  state: PROPOSE
  handler: host_callback
  config:
    num_agents: 1
    prompt: The console commits the clone's changes on the improvement branch, pushes it and opens or updates the pull request with the criteria, the change and the evidence. It records pull_request, url, head_sha and proposed=true, or proposed=false with the error.
    see_prior: true
- id: watch
  state: WATCH
  handler: host_callback
  config:
    num_agents: 1
    prompt: The console polls the pull request's checks and merge state, bringing the branch up to date with the base when it falls behind. It records verdict green when every check passed, red with the failing checks when one failed and a build round remains, and blocked when the rounds are exhausted, the checks stall past the deadline or the pull request was closed outside the ceremony.
    see_prior: true
- id: decide
  state: DECIDE
  handler: host_callback
  config:
    num_agents: 1
    prompt: The console shows the person the pull request and records approve or decline on their keypress; an improvement never merges without the person. Approval also needs the human guard, granted through the separate approver identity.
    see_prior: true
- id: merge
  state: MERGE
  handler: host_callback
  config:
    num_agents: 1
    prompt: The console squash-merges the pull request, deletes the improvement branch and records merged=true with merge_sha, or merged=false with the error. It then writes the improvement outcome to project memory.
    see_prior: true
guards:
  brief_completed: {type: automated, check: 'step_status:brief:COMPLETED'}
  improvement_missing: {type: automated, check: 'output_field:brief:missing=true'}
  declared_not_feasible: {type: automated, check: 'output_field:brief:feasible=false'}
  brief_exhausted: {type: automated, check: 'step_repeat_exhausted:brief'}
  build_completed: {type: automated, check: 'step_status:build:COMPLETED'}
  check_passes: {type: automated, check: 'output_field:build:verified=true'}
  build_exhausted: {type: automated, check: 'step_repeat_exhausted:build'}
  propose_completed: {type: automated, check: 'step_status:propose:COMPLETED'}
  pull_request_open: {type: automated, check: 'output_field:propose:proposed=true'}
  pull_request_failed: {type: automated, check: 'output_field:propose:proposed=false'}
  watch_completed: {type: automated, check: 'step_status:watch:COMPLETED'}
  checks_green: {type: automated, check: 'output_field:watch:verdict="green"'}
  checks_red: {type: automated, check: 'output_field:watch:verdict="red"'}
  checks_blocked: {type: automated, check: 'output_field:watch:verdict="blocked"'}
  decide_completed: {type: automated, check: 'step_status:decide:COMPLETED'}
  person_requested_merge: {type: automated, check: 'output_field:decide:decision="approve"'}
  person_declined: {type: automated, check: 'output_field:decide:decision="decline"'}
  person_approves: {type: human, check: manual_approval}
  merge_completed: {type: automated, check: 'step_status:merge:COMPLETED'}
  pull_request_merged: {type: automated, check: 'output_field:merge:merged=true'}
  pull_request_not_merged: {type: automated, check: 'output_field:merge:merged=false'}
roles:
- id: AXLR
  allowed_actions: [brief, briefed, not_feasible, brief_exhausted, build, verified, build_exhausted, propose, proposed, propose_failed, watch, checks_passed, checks_failed, watch_blocked, decide, merge_declined, merge, merged, merge_failed]
- id: HUMAN_APPROVER
  allowed_actions: [merge_approved]
timeouts:
  step_default: 3600
retry_policies:
  default: {max_attempts: 1, backoff_seconds: 1}
max_parallel: 1
max_transitions: 40
max_bounces: 4
