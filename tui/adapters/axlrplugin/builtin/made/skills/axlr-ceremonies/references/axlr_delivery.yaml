version: '1.0'
name: axlr_delivery
description: Deliver a nontrivial feature through an explicit brief and a bounded build, verify, review loop, then integrate the accepted result.
inputs:
  required:
  - task_brief
  - workspace
  - acceptance_criteria
  optional:
  - memory_scope
  - execution_profile
outputs:
  delivery_report:
    type: object
states:
- id: FRAME_DELIVERY
  initial: true
- id: DELIVERY_LOOP
  repeat:
    max_iterations: 3
    until:
      step: review_candidate
      output_field: accepted
      equals: true
- id: INTEGRATE_DELIVERY
- id: COMPLETED
  terminal: true
transitions:
- from: FRAME_DELIVERY
  to: DELIVERY_LOOP
  trigger: frame_delivery_completed
  guards:
  - exit_frame_delivery_1
  - frame_delivery_completed
- from: DELIVERY_LOOP
  to: INTEGRATE_DELIVERY
  trigger: delivery_loop_completed
  guards:
  - delivery_loop_build_candidate_completed
  - delivery_loop_review_candidate_completed
  - delivery_loop_verify_candidate_completed
  - accepted_axlr_delivery
  - candidate_verified
- from: INTEGRATE_DELIVERY
  to: COMPLETED
  trigger: integrate_delivery_completed
  guards:
  - exit_integrate_delivery_1
  - integrate_delivery_completed
steps:
- id: frame_delivery
  state: FRAME_DELIVERY
  handler: host_callback
  config:
    num_agents: 1
    prompt: Recover opted-in memory, repository rules and current implementation. State behavior, acceptance criteria, boundaries, risks and verification. Resolve routine choices autonomously; request only missing decisions that affect scope. Output delivery_plan, baseline_ref, criteria and ready=true when executable. Parallel work requires explicit host capability and authorization, and disjoint ownership.
    see_prior: false
  timeout_seconds: 600
- id: build_candidate
  state: DELIVERY_LOOP
  handler: host_callback
  config:
    num_agents: 1
    prompt: Implement the smallest candidate satisfying the sealed acceptance criteria. In later iterations address the prior review findings; do not grow scope. Output candidate_ref, changed_files, diff_ref and addressed_findings.
    see_prior: true
  timeout_seconds: 1800
- id: verify_candidate
  state: DELIVERY_LOOP
  handler: host_callback
  config:
    num_agents: 1
    prompt: Verify the exact candidate_ref using required repository checks and acceptance scenarios. For UI work exercise relevant states and capture actual evidence. Record command, exit status, revision and artifact refs. Output verified as a boolean, checks, acceptance_results and limitations. Never convert a failed or missing required check into a pass.
    see_prior: true
  timeout_seconds: 1800
- id: review_candidate
  state: DELIVERY_LOOP
  handler: host_callback
  config:
    num_agents: 1
    prompt: Evaluate the exact candidate and verification outputs against the acceptance criteria, regressions and maintainability. Declare review_mode=self or independent and the actual reviewer identity; do not label the same implementer independent. Output findings, reviewed_ref, review_mode, evidence and accepted=true only if verified=true for this revision and there are no unresolved blocking findings. Otherwise accepted=false with actionable findings.
    see_prior: true
- id: integrate_delivery
  state: INTEGRATE_DELIVERY
  handler: host_callback
  config:
    num_agents: 1
    prompt: Integrate only the accepted reviewed_ref. Preserve user changes and check the final diff and required validations if integration changes content. Create only authorized delivery artifacts. Report outcome, evidence, limitations and follow-up. Record a concise opted-in memory outcome. Output delivery_report and integrated=true only when the delivered revision is the verified, accepted revision.
    see_prior: true
guards:
  delivery_loop_build_candidate_completed:
    type: automated
    check: step_status:build_candidate:COMPLETED
  delivery_loop_review_candidate_completed:
    type: automated
    check: step_status:review_candidate:COMPLETED
  delivery_loop_verify_candidate_completed:
    type: automated
    check: step_status:verify_candidate:COMPLETED
  exit_frame_delivery_1:
    type: automated
    check: output_field:frame_delivery:ready=true
  exit_integrate_delivery_1:
    type: automated
    check: output_field:integrate_delivery:integrated=true
  frame_delivery_completed:
    type: automated
    check: step_status:frame_delivery:COMPLETED
  integrate_delivery_completed:
    type: automated
    check: step_status:integrate_delivery:COMPLETED
  accepted_axlr_delivery:
    type: automated
    check: output_field:review_candidate:accepted=true
  candidate_verified:
    type: automated
    check: output_field:verify_candidate:verified=true
roles:
- id: PLANNER
  allowed_actions:
  - frame_delivery
  - frame_delivery_completed
- id: IMPLEMENTER
  allowed_actions:
  - build_candidate
  - delivery_loop_completed
- id: VERIFIER
  allowed_actions:
  - verify_candidate
- id: REVIEWER
  allowed_actions:
  - review_candidate
- id: INTEGRATOR
  allowed_actions:
  - integrate_delivery
  - integrate_delivery_completed
timeouts:
  step_default: 900
retry_policies:
  default:
    max_attempts: 1
    backoff_seconds: 1
max_parallel: 1
max_transitions: 40
max_bounces: 3
