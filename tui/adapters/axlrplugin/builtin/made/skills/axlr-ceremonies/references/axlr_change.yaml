version: '1.0'
name: axlr_change
description: Deliver a small, understood, reversible AXLR change with proportionate verification and an honest handback.
inputs:
  required:
  - task_brief
  - workspace
  - acceptance_criteria
  optional:
  - memory_scope
  - execution_profile
outputs:
  delivery_report:
    type: object
states:
- id: SCOPE_CHANGE
  initial: true
- id: CHANGE_AND_CHECK
- id: HAND_BACK
- id: COMPLETED
  terminal: true
transitions:
- from: SCOPE_CHANGE
  to: CHANGE_AND_CHECK
  trigger: scope_change_completed
  guards:
  - exit_scope_change_1
  - scope_change_completed
- from: CHANGE_AND_CHECK
  to: HAND_BACK
  trigger: change_and_check_completed
  guards:
  - change_and_check_completed
  - exit_change_and_check_1
- from: HAND_BACK
  to: COMPLETED
  trigger: hand_back_completed
  guards:
  - exit_hand_back_1
  - hand_back_completed
steps:
- id: scope_change
  state: SCOPE_CHANGE
  handler: host_callback
  config:
    num_agents: 1
    prompt: Recover relevant opted-in memory and inspect instructions, current files and Git state. Confirm the requested behavior, a small bounded change and a proportionate check. Output scope, baseline_ref, acceptance_criteria, verification_plan and ready=true only when implementation is understood. If discovery reveals an architectural decision or an unexplained failure, pause and route to delivery or debug.
    see_prior: false
  timeout_seconds: 300
- id: change_and_check
  state: CHANGE_AND_CHECK
  handler: host_callback
  config:
    num_agents: 1
    prompt: Implement the scoped change and run the planned checks on the actual final files. Inspect the diff. Do not add tests that only mirror a trivial edit. Output changed_files, diff_ref, checks with command/status/evidence, limitations and verified=true only when acceptance criteria and required checks pass. Failed or unavailable required checks mean verified=false.
    see_prior: true
- id: hand_back
  state: HAND_BACK
  handler: host_callback
  config:
    num_agents: 1
    prompt: Check that the diff and evidence refer to the same final revision. Package the result, checks and remaining limitations in the user language. Make only already-authorized Git or external actions. Record an evidence-backed KMP outcome when memory is opted in. Output delivery_report and delivered=true only for the scoped, verified result.
    see_prior: true
  timeout_seconds: 300
guards:
  change_and_check_completed:
    type: automated
    check: step_status:change_and_check:COMPLETED
  exit_change_and_check_1:
    type: automated
    check: output_field:change_and_check:verified=true
  exit_hand_back_1:
    type: automated
    check: output_field:hand_back:delivered=true
  exit_scope_change_1:
    type: automated
    check: output_field:scope_change:ready=true
  hand_back_completed:
    type: automated
    check: step_status:hand_back:COMPLETED
  scope_change_completed:
    type: automated
    check: step_status:scope_change:COMPLETED
roles:
- id: IMPLEMENTER
  allowed_actions:
  - change_and_check
  - change_and_check_completed
  - scope_change
  - scope_change_completed
- id: INTEGRATOR
  allowed_actions:
  - hand_back
  - hand_back_completed
timeouts:
  step_default: 900
retry_policies:
  default:
    max_attempts: 1
    backoff_seconds: 1
max_parallel: 1
max_transitions: 40
max_bounces: 3
