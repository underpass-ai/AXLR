version: '1.0'
name: axlr_handoff
description: Transfer ownership of ongoing work only after a real receiver accepts a complete, verifiable checkpoint.
inputs:
  required:
  - task_brief
  - workspace
  - source_actor
  - target_actor
  optional:
  - memory_scope
  - execution_profile
outputs:
  handoff_report:
    type: object
states:
- id: PREPARE_HANDOFF
  initial: true
- id: ACCEPT_HANDOFF
- id: SEAL_HANDOFF
- id: COMPLETED
  terminal: true
transitions:
- from: PREPARE_HANDOFF
  to: ACCEPT_HANDOFF
  trigger: prepare_handoff_completed
  guards:
  - exit_prepare_handoff_1
  - prepare_handoff_completed
- from: ACCEPT_HANDOFF
  to: SEAL_HANDOFF
  trigger: accept_handoff_completed
  guards:
  - accept_handoff_completed
  - exit_accept_handoff_1
- from: SEAL_HANDOFF
  to: COMPLETED
  trigger: seal_handoff_completed
  guards:
  - exit_seal_handoff_1
  - seal_handoff_completed
steps:
- id: prepare_handoff
  state: PREPARE_HANDOFF
  handler: host_callback
  config:
    num_agents: 1
    prompt: Create a durable handoff packet with objective, acceptance criteria, authorization and constraints; repository/worktree/branch/revision and dirty files; decisions and evidence refs; completed and pending work; check commands/status/revision; blockers and the exact next action; artifact refs, memory about/context/frontier, source ceremony instance/definition digest/state, event/activity cursors and active claim identities. Record requested versus actual host profiles, or unknown, without secrets. Inspect resume state before any transfer. Preserve the source instance; a packet does not release a live claim. Output packet_ref, packet_digest, source_actor, target_actor and ready=true only when the receiver can resume from evidence.
    see_prior: false
- id: accept_handoff
  state: ACCEPT_HANDOFF
  handler: host_callback
  config:
    num_agents: 1
    prompt: The actual target_actor must read the exact packet, inspect the workspace and MADE resume state, and reconcile current revision, pending operations and claims. A different logical role on the same sender is not receipt. Return receiver_identity, packet_digest, verified_revision, accepted_next_action, uncertainties and accepted=true only after the real receiver acknowledges ownership and can continue safely. If absent or missing context, leave accepted=false with missing information; do not impersonate or spawn a receiver without authorization.
    see_prior: true
- id: seal_handoff
  state: SEAL_HANDOFF
  handler: host_callback
  config:
    num_agents: 1
    prompt: Check receiver acknowledgment matches the exact packet digest and current source instance. Record host handoff or participant rebinding through discovered MADE APIs where applicable and authorized, after handling active leases and stale fences. Verify the persisted receipt and a single owner for the next action. Never silently restart completed external work or replace an instance. Output handoff_report, receipt_ref, continuation_owner and transferred=true only when the durable transfer and receiver ownership are confirmed. Until then the source remains paused or explicitly owned.
    see_prior: true
  timeout_seconds: 600
guards:
  accept_handoff_completed:
    type: automated
    check: step_status:accept_handoff:COMPLETED
  exit_accept_handoff_1:
    type: automated
    check: output_field:accept_handoff:accepted=true
  exit_prepare_handoff_1:
    type: automated
    check: output_field:prepare_handoff:ready=true
  exit_seal_handoff_1:
    type: automated
    check: output_field:seal_handoff:transferred=true
  prepare_handoff_completed:
    type: automated
    check: step_status:prepare_handoff:COMPLETED
  seal_handoff_completed:
    type: automated
    check: step_status:seal_handoff:COMPLETED
roles:
- id: SENDER
  allowed_actions:
  - prepare_handoff
  - prepare_handoff_completed
- id: RECEIVER
  allowed_actions:
  - accept_handoff
  - accept_handoff_completed
- id: INTEGRATOR
  allowed_actions:
  - seal_handoff
  - seal_handoff_completed
timeouts:
  step_default: 900
retry_policies:
  default:
    max_attempts: 1
    backoff_seconds: 1
max_parallel: 1
max_transitions: 40
max_bounces: 3
