version: '1.0'
name: axlr_publish
description: Prepare an exact verified artifact and require a genuine human approval boundary before any external publication.
inputs:
  required:
  - artifact_ref
  - destination
  - verification_evidence
  - publication_scope
  optional:
  - memory_scope
  - execution_profile
outputs:
  publication_report:
    type: object
states:
- id: PREPARE_PUBLICATION
  initial: true
- id: PUBLISH_ARTIFACT
- id: CONFIRM_PUBLICATION
- id: COMPLETED
  terminal: true
transitions:
- from: PREPARE_PUBLICATION
  to: PUBLISH_ARTIFACT
  trigger: approve_publication
  guards:
  - exit_prepare_publication_1
  - human_approved_publication
  - prepare_publication_completed
- from: PUBLISH_ARTIFACT
  to: CONFIRM_PUBLICATION
  trigger: publish_artifact_completed
  guards:
  - publish_artifact_completed
  - publish_artifact_verified
- from: CONFIRM_PUBLICATION
  to: COMPLETED
  trigger: confirm_publication_completed
  guards:
  - confirm_publication_completed
  - confirm_publication_verified
steps:
- id: prepare_publication
  state: PREPARE_PUBLICATION
  handler: host_callback
  config:
    num_agents: 1
    prompt: Resolve the exact final artifact digest or Git revision, destination, external operation, verification evidence and recovery plan. Present the concrete artifact for review. Output publication_packet, artifact_digest, destination, scope and ready=true only when everything is reviewable and verified. Perform no publication in this stage.
    see_prior: false
- id: publish_artifact
  state: PUBLISH_ARTIFACT
  handler: host_callback
  config:
    num_agents: 1
    prompt: Read the genuine approval receipt and compare the current artifact digest, destination and scope to the approved publication packet. Any mismatch requires a fresh human decision. Perform exactly the authorized operation through a real host capability, using a stable operation id and deduplication where supported. Inspect existing receipts before retrying uncertain external work. Output published=true only after an attributable external receipt, plus operation_id, artifact_digest, destination and receipt_ref. No-op or missing capabilities mean published=false.
    see_prior: true
- id: confirm_publication
  state: CONFIRM_PUBLICATION
  handler: host_callback
  config:
    num_agents: 1
    prompt: Read back the published artifact or remote operation through an authorized source and verify identity and expected behavior. A successful request alone does not prove publication. Output confirmed=true only after verifying the exact approved artifact at its destination, with receipt_ref, readback_evidence and publication_report. Report uncertainty and recovery steps without declaring success when readback fails.
    see_prior: true
guards:
  exit_prepare_publication_1:
    type: automated
    check: output_field:prepare_publication:ready=true
  human_approved_publication:
    type: human
    check: manual_approval
  prepare_publication_completed:
    type: automated
    check: step_status:prepare_publication:COMPLETED
  publish_artifact_completed:
    type: automated
    check: step_status:publish_artifact:COMPLETED
  publish_artifact_verified:
    type: automated
    check: output_field:publish_artifact:published=true
  confirm_publication_completed:
    type: automated
    check: step_status:confirm_publication:COMPLETED
  confirm_publication_verified:
    type: automated
    check: output_field:confirm_publication:confirmed=true
roles:
- id: INTEGRATOR
  allowed_actions:
  - prepare_publication
  - publish_artifact
  - publish_artifact_completed
  - confirm_publication
  - confirm_publication_completed
- id: HUMAN_APPROVER
  allowed_actions:
  - approve_publication
timeouts:
  step_default: 900
retry_policies:
  default:
    max_attempts: 1
    backoff_seconds: 1
max_parallel: 1
max_transitions: 40
max_bounces: 3
